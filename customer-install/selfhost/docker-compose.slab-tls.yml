# Safety Lab Aero additions, layered after docker-compose.caddy.yml by install.sh (COMPOSE_FILE in .env).
#   1. mount the customer's certificate into Caddy
#   2. switch off two services the Safety Lab app never uses: the connection pooler (which is
#      the only thing that exposes the database port outside the box) and the edge-function
#      runtime (which downloads packages from the internet at boot, so an air-gapped install
#      would never come up healthy). Fewer moving parts, fewer open ports.
services:
  caddy:
    volumes:
      - ./volumes/proxy/certs:/etc/caddy/certs:ro
  supavisor:
    profiles: ["not-used-by-safety-lab"]
  functions:
    profiles: ["not-used-by-safety-lab"]
